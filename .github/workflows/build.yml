
name: Compilar Mixto-Sonora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar estructura existente
        run: |
          echo "===== RAIZ DEL REPOSITORIO ====="
          ls -la
          echo "===== SONORA ====="
          ls -la Sonora-main
          echo "===== ANDROID ====="
          ls -la mixto-Sonora

          if [ ! -d "Sonora-main" ]; then
            echo "::error::No existe Sonora-main/"
            exit 1
          fi

          if [ ! -d "mixto-Sonora/app" ]; then
            echo "::error::No existe mixto-Sonora/app/"
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Sonora-main/package-lock.json

      - name: Instalar dependencias de Sonora
        working-directory: Sonora-main
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Compilar interfaz web de Sonora
        working-directory: Sonora-main
        run: |
          echo "No se exige VITE_SONORA_API_URL para compilar."
          npm run build

      - name: Copiar interfaz Sonora a Android
        run: |
          if [ ! -d "Sonora-main/dist" ]; then
            echo "::error::Sonora no generó la carpeta dist/"
            exit 1
          fi

          mkdir -p mixto-Sonora/app/src/main/assets/sonora
          cp -r Sonora-main/dist/. mixto-Sonora/app/src/main/assets/sonora/

          echo "===== ARCHIVOS WEB COPIADOS ====="
          find mixto-Sonora/app/src/main/assets/sonora -maxdepth 2 -type f

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar APK Android
        working-directory: mixto-Sonora
        run: gradle assembleDebug --stacktrace

      - name: Comprobar APK generado
        run: |
          echo "===== APK GENERADOS ====="
          find mixto-Sonora -type f -name "*.apk" -print

          if ! find mixto-Sonora -type f \
            -path "*/build/outputs/apk/*/*.apk" | grep -q .; then
            echo "::error::La compilación no produjo ningún APK"
            exit 1
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mixto-Sonora-APK
          path: mixto-Sonora/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
