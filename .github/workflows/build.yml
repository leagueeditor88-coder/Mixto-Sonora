name: Compilar Mixto-Sonora APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Corregir nombres de carpetas con espacios (si existen)
        run: |
          echo "Verificando estructura de carpetas..."
          if [ -d "mixto-Sonora/ app" ]; then
            echo "Renombrando 'mixto-Sonora/ app' a 'mixto-Sonora/app'..."
            mv "mixto-Sonora/ app" mixto-Sonora/app
          fi
          if [ -d "Sonora-main/ src" ]; then
            echo "Renombrando 'Sonora-main/ src' a 'Sonora-main/src'..."
            mv "Sonora-main/ src" Sonora-main/src
          fi

      - name: Configurar Node.js y compilar Sonora Web
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compilar interfaz web Sonora y sincronizar assets
        env:
          VITE_SONORA_API_URL: ${{ vars.SONORA_API_URL }}
        run: |
          if [ -n "$VITE_SONORA_API_URL" ]; then echo "Backend multi-fuente configurado."; else echo "AVISO: SONORA_API_URL no configurada; APK usará el respaldo limitado de iTunes."; fi
          echo "Compilando aplicación web Sonora..."
          cd Sonora-main
          npm ci || npm install
          npm test
          npm run build
          cd ..
          echo "Copiando distribución web a los assets de Android..."
          mkdir -p mixto-Sonora/app/src/main/assets/sonora
          rm -rf mixto-Sonora/app/src/main/assets/sonora/*
          cp -r Sonora-main/dist/* mixto-Sonora/app/src/main/assets/sonora/
          echo "Verificando que el bundle incluye el puente de biblioteca Mixto..."
          test -f mixto-Sonora/app/src/main/assets/sonora/index.html
          JS_ASSETS="mixto-Sonora/app/src/main/assets/sonora/assets"
          if ! find "$JS_ASSETS" -type f -name '*.js' -print -quit | grep -q .; then
            echo "::error::No se encontraron archivos JavaScript compilados de Sonora."
            exit 1
          fi
          # Vite puede repartir el código en varios chunks; buscar en todos, no solo en el primero.
          grep -Rq 'MixtoLibrary' "$JS_ASSETS" || { echo "::error::El JavaScript compilado no contiene MixtoLibrary; comprobar Sonora-main/src/App.tsx y la configuración de build."; exit 1; }
          grep -Rq '__mixtoPendingTrack' "$JS_ASSETS" || { echo "::error::El JavaScript compilado no contiene __mixtoPendingTrack; comprobar el enlace de canción seleccionada."; exit 1; }
          ls -la mixto-Sonora/app/src/main/assets/sonora/

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK Android
        working-directory: mixto-Sonora
        run: gradle assembleDebug --stacktrace

      - name: Mostrar APK generado
        run: |
          echo "===== APK GENERADOS ====="
          find mixto-Sonora -type f -name "*.apk" -print
          if ! find mixto-Sonora -type f -path "*/build/outputs/apk/*/*.apk" | grep -q .; then
            echo "::error::La compilación no produjo ningún APK"
            exit 1
          fi

      - name: Publicar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Mixto-Sonora-APK
          path: mixto-Sonora/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
